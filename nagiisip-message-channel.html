<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAGIISIP — Message Channel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sun-50:  #FFFBEF;
    --sun-100: #FFF3CE;
    --sun-300: #FFDD7A;
    --sun-500: #FFC93C;
    --sun-600: #FF9F45;
    --royal-500: #3A4DB0;
    --royal-600: #2E3E9E;
    --royal-700: #1F2C74;
    --ink-900: #2A2115;
    --ink-600: #5B5138;
    --cream-0: #FFFEFA;
    --line: rgba(42,33,21,0.13);
    --shadow: 0 10px 26px rgba(31,44,116,0.12);
    --radius-lg: 22px;
    --radius-md: 16px;
    color-scheme: light dark;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --sun-50:  #12163A;
      --sun-100: #171C46;
      --sun-300: #232B66;
      --sun-500: #FFC93C;
      --sun-600: #FF9F45;
      --royal-500: #5A6FE0;
      --royal-600: #6B7DEA;
      --royal-700: #C9D2FF;
      --ink-900: #F3EFE2;
      --ink-600: #C7C1AC;
      --cream-0: #1E2452;
      --line: rgba(255,246,220,0.12);
      --shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"] {
    --sun-50:  #12163A;
    --sun-100: #171C46;
    --sun-300: #232B66;
    --sun-500: #FFC93C;
    --sun-600: #FF9F45;
    --royal-500: #5A6FE0;
    --royal-600: #6B7DEA;
    --royal-700: #C9D2FF;
    --ink-900: #F3EFE2;
    --ink-600: #C7C1AC;
    --cream-0: #1E2452;
    --line: rgba(255,246,220,0.12);
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink-900);
    background:
      radial-gradient(circle at 15% -10%, var(--sun-300) 0%, transparent 55%),
      linear-gradient(180deg, var(--sun-50) 0%, var(--sun-100) 100%);
    min-height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }
  h1, h2, h3, .brand, .route-name { font-family: 'Space Grotesk', 'Inter', sans-serif; }

  .app {
    display: flex;
    height: 100vh;
    height: 100dvh;
    max-width: 1180px;
    margin: 0 auto;
    padding: 22px;
    gap: 20px;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 360px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: linear-gradient(160deg, var(--sun-500) 0%, var(--sun-600) 100%);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .sidebar-head {
    padding: 22px 22px 16px;
    color: var(--royal-700);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .brand-mark {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--royal-600);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-sub {
    margin: 6px 0 0;
    font-size: 13px;
    color: rgba(31,44,116,0.72);
    font-weight: 500;
  }
  .channel-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 10px 14px;
  }
  .channel {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 12px;
    border: none;
    background: transparent;
    border-radius: var(--radius-md);
    cursor: pointer;
    text-align: left;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .channel:hover { background: rgba(255,254,250,0.35); }
  .channel.active { background: var(--cream-0); box-shadow: var(--shadow); }
  .channel-avatar {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--royal-700);
    color: var(--sun-300);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    flex-shrink: 0;
  }
  .channel-text { min-width: 0; }
  .channel-queue {
    font-weight: 600;
    font-size: 13.5px;
    color: var(--royal-700);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .channel.active .channel-queue { color: var(--ink-900); }
  .channel-task {
    font-size: 12px;
    margin-top: 2px;
    color: rgba(31,44,116,0.65);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .channel.active .channel-task { color: var(--ink-600); }
  .sidebar-foot {
    padding: 14px 22px 18px;
    font-size: 12px;
    color: rgba(31,44,116,0.6);
    border-top: 1px solid rgba(31,44,116,0.12);
  }

  /* ---------- Main / thread ---------- */
  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--cream-0);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .thread-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 22px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .back-btn {
    display: none;
    width: 34px; height: 34px;
    border-radius: 10px;
    border: none;
    background: var(--sun-100);
    color: var(--royal-700);
    align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .route {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .route-name {
    font-weight: 600;
    font-size: 15px;
    color: var(--ink-900);
  }
  .route-pattern {
    font-size: 12px;
    color: var(--ink-600);
    margin-top: 2px;
  }
  .route-arrow { color: var(--royal-500); opacity: 0.55; flex-shrink: 0; }
  .route-arrow svg { display: block; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .day-stamp {
    align-self: center;
    font-size: 11.5px;
    color: var(--ink-600);
    background: var(--sun-100);
    padding: 3px 12px;
    border-radius: 999px;
    margin: 6px 0 14px;
  }
  .bubble-row {
    display: flex;
    margin: 3px 0;
  }
  .bubble-row.me { justify-content: flex-end; }
  .bubble-row.them { justify-content: flex-start; }
  .bubble {
    max-width: 74%;
    padding: 10px 14px;
    font-size: 14.5px;
    line-height: 1.42;
    border-radius: 18px;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .bubble-row.me .bubble {
    background: var(--royal-600);
    color: #FFFCF2;
    border-bottom-right-radius: 5px;
  }
  .bubble-row.them .bubble {
    background: var(--sun-100);
    color: var(--ink-900);
    border: 1px solid var(--line);
    border-bottom-left-radius: 5px;
    font-family: 'Space Grotesk', 'Inter', monospace;
    font-size: 13.5px;
  }
  .meta-row {
    display: flex;
    font-size: 10.5px;
    color: var(--ink-600);
    margin: 2px 4px 10px;
  }
  .meta-row.me { justify-content: flex-end; }
  .meta-row.them { justify-content: flex-start; }

  .relay {
    align-self: center;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--royal-600);
    background: var(--sun-50);
    border: 1px solid var(--line);
    padding: 5px 13px;
    border-radius: 999px;
    margin: 8px 0;
    opacity: 0;
    transform: translateY(4px);
    animation: relayIn 0.35s ease forwards;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
  }
  .relay.out { animation: relayOut 0.4s ease forwards; }
  .relay svg { width: 12px; height: 12px; }
  @keyframes relayIn { to { opacity: 1; transform: translateY(0); } }
  @keyframes relayOut { to { opacity: 0; transform: translateY(-4px); } }

  .typing {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--sun-100);
    border: 1px solid var(--line);
    padding: 12px 16px;
    border-radius: 18px;
    border-bottom-left-radius: 5px;
  }
  .typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--royal-500);
    opacity: 0.55;
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .55; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .composer {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }
  .composer input {
    flex: 1;
    border: 1px solid var(--line);
    background: var(--sun-50);
    color: var(--ink-900);
    border-radius: 999px;
    padding: 12px 18px;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
  }
  .composer input:focus { border-color: var(--royal-500); }
  .composer input::placeholder { color: var(--ink-600); }
  .send-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: none;
    background: var(--royal-600);
    color: #FFFCF2;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.12s ease;
  }
  .send-btn:active { transform: scale(0.92); }
  .send-btn svg { width: 18px; height: 18px; }

  @media (max-width: 760px) {
    .app { padding: 0; gap: 0; height: 100dvh; }
    .sidebar { width: 100%; border-radius: 0; }
    .main {
      position: fixed;
      inset: 0;
      border-radius: 0;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(.4,0,.2,1);
    }
    .app.thread-open .main { transform: translateX(0); }
    .app.thread-open .sidebar { display: none; }
    .back-btn { display: flex; }
    .main { padding-top: env(safe-area-inset-top, 0px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .relay, .bubble-row, .typing span { animation: none !important; transition: none !important; }
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(31,44,116,0.18); border-radius: 8px; }
</style>
</head>
<body>

<div class="app" id="app">

  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 6l8 6 8-6M4 6v12h16V6" stroke="#FFDD7A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        NAGIISIP
      </div>
      <p class="brand-sub">Message Channel · Enterprise Integration Patterns</p>
    </div>
    <div class="channel-list" id="channelList"></div>
    <div class="sidebar-foot">ITP103 Midterm Lab &middot; Group SILANGAN &middot; 3 IT-A</div>
  </aside>

  <section class="main">
    <div class="thread-head">
      <button class="back-btn" id="backBtn" aria-label="Back to channels">
        <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="route" id="routeInfo"></div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input id="msgInput" type="text" placeholder="Type a message for this channel…" maxlength="140">
      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l16-8-6 16-3-7-7-1z" fill="currentColor"/></svg>
      </button>
    </div>
  </section>

</div>

<script>
(function () {
  const relayIcon = '<svg viewBox="0 0 24 24" fill="none"><path d="M2 12h20M15 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const arrowIcon = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none"><path d="M4 12h16M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function fmtTime(d) {
    let h = d.getHours(), m = d.getMinutes();
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + String(m).padStart(2, '0') + ' ' + ap;
  }

  const CHANNELS = [
    {
      id: 'msgchannel',
      queue: 'customer.registrations',
      task: 'Task 1 · Message Channel',
      producer: 'Web App', pInit: 'WA',
      consumer: 'Back-end System', cInit: 'BE',
      state: { next: 10233 },
      seed: [
        ['me', 'New registration — Juan Dela Cruz, juan.delacruz@email.com'],
        ['them', 'ACK received. Registration #10231 queued for processing.'],
        ['me', 'New registration — Ana Reyes, ana.reyes@email.com'],
        ['them', 'ACK received. Registration #10232 queued for processing.']
      ],
      reply(text, st) {
        const id = st.next++;
        return 'ACK received. Registration #' + id + ' queued for processing.';
      }
    },
    {
      id: 'router',
      queue: 'registrations.inbound',
      task: 'Task 2 · Content-Based Router',
      producer: 'Registration Source', pInit: 'RS',
      consumer: 'Router', cInit: 'CR',
      state: {},
      seed: [
        ['me', 'Registrant: Mikaela Santos, Laguna, Philippines'],
        ['them', 'Routed → registrations.local (Local PH system)'],
        ['me', 'Registrant: David Kim, Seoul, South Korea'],
        ['them', 'Routed → registrations.international (Intl system)']
      ],
      reply(text) {
        const local = /ph|philippin|local|manila|laguna|cebu|cabuyao/i.test(text);
        return local
          ? 'Routed → registrations.local (Local PH system)'
          : 'Routed → registrations.international (Intl system)';
      }
    },
    {
      id: 'aggregator',
      queue: 'orders.parts',
      task: 'Task 3 · Aggregator',
      producer: 'Order · Payment · Shipping', pInit: 'OPS',
      consumer: 'Aggregator', cInit: 'AG',
      state: { count: 2 },
      seed: [
        ['me', 'order-4471 — order details received'],
        ['them', '1 of 3 parts received for order-4471. Waiting for payment, shipping.'],
        ['me', 'order-4471 — payment confirmed'],
        ['them', '2 of 3 parts received for order-4471. Waiting for shipping.']
      ],
      reply(text, st) {
        st.count = (st.count % 3) + 1;
        if (st.count === 3) {
          return 'All 3 parts received for order-4471. Summary emitted → orders.summaries.';
        }
        return st.count + ' of 3 parts received for order-4471. Waiting for the rest.';
      }
    },
    {
      id: 'translator',
      queue: 'legacy.customers.xml → crm.customers.json',
      task: 'Task 4 · Message Translator',
      producer: 'Legacy XML System', pInit: 'LX',
      consumer: 'Translator', cInit: 'MT',
      state: {},
      seed: [
        ['me', '<customer><name>Liza Cruz</name><email>liza@x.com</email></customer>'],
        ['them', '{"name":"Liza Cruz","email":"liza@x.com"} → forwarded to crm.customers.json']
      ],
      reply(text) {
        const name = (text.match(/<name>(.*?)<\/name>/i) || [])[1];
        const email = (text.match(/<email>(.*?)<\/email>/i) || [])[1];
        if (name || email) {
          const obj = {};
          if (name) obj.name = name;
          if (email) obj.email = email;
          return JSON.stringify(obj) + ' → forwarded to crm.customers.json';
        }
        return 'Payload translated to JSON → forwarded to crm.customers.json';
      }
    },
    {
      id: 'deadletter',
      queue: 'crm.delivery → crm.errors → crm.parkinglot',
      task: 'Task 5 · Dead Letter Channel + Retry',
      producer: 'Retry Route', pInit: 'RR',
      consumer: 'Target CRM', cInit: 'TC',
      state: { attempt: 2 },
      seed: [
        ['me', 'Delivering customer #8820 to Target CRM (attempt 1/3)'],
        ['them', 'Delivery failed — connection refused. Retrying in 2s.'],
        ['me', 'Delivering customer #8820 to Target CRM (attempt 2/3)'],
        ['them', 'Delivered. ACK from Target CRM.']
      ],
      reply(text, st) {
        st.attempt = (st.attempt % 3) + 1;
        if (st.attempt < 3) {
          return 'Delivery failed — timeout. Retrying (attempt ' + st.attempt + '/3).';
        }
        return 'Delivery failed after 3 attempts → moved to crm.parkinglot for manual review.';
      }
    }
  ];

  let activeId = CHANNELS[0].id;
  const listEl = document.getElementById('channelList');
  const routeEl = document.getElementById('routeInfo');
  const msgsEl = document.getElementById('messages');
  const appEl = document.getElementById('app');
  const inputEl = document.getElementById('msgInput');

  function channel(id) { return CHANNELS.find(c => c.id === id); }

  function renderSidebar() {
    listEl.innerHTML = '';
    CHANNELS.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'channel' + (c.id === activeId ? ' active' : '');
      btn.innerHTML =
        '<span class="channel-avatar">' + c.cInit + '</span>' +
        '<span class="channel-text">' +
          '<div class="channel-queue">' + c.queue + '</div>' +
          '<div class="channel-task">' + c.task + '</div>' +
        '</span>';
      btn.addEventListener('click', () => openChannel(c.id));
      listEl.appendChild(btn);
    });
  }

  function renderRoute(c) {
    routeEl.innerHTML =
      '<span class="channel-avatar" style="width:36px;height:36px;font-size:11px;">' + c.pInit + '</span>' +
      '<span style="min-width:0;flex:1;">' +
        '<div class="route-name">' + c.producer + ' <span class="route-arrow">' + arrowIcon + '</span> ' + c.consumer + '</div>' +
        '<div class="route-pattern">' + c.task + ' &middot; ' + c.queue + '</div>' +
      '</span>';
  }

  function bubble(from, text, time) {
    const row = document.createElement('div');
    row.className = 'bubble-row ' + from;
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    row.appendChild(b);
    msgsEl.appendChild(row);
    if (time) {
      const meta = document.createElement('div');
      meta.className = 'meta-row ' + from;
      meta.textContent = time;
      msgsEl.appendChild(meta);
    }
  }

  function openChannel(id) {
    activeId = id;
    const c = channel(id);
    renderSidebar();
    renderRoute(c);
    msgsEl.innerHTML = '';
    const stamp = document.createElement('div');
    stamp.className = 'day-stamp';
    stamp.textContent = 'Route opened · ' + c.queue;
    msgsEl.appendChild(stamp);
    let t = new Date(Date.now() - c.seed.length * 60000);
    c.seed.forEach(([from, text]) => {
      t = new Date(t.getTime() + 60000);
      bubble(from, text, fmtTime(t));
    });
    msgsEl.scrollTop = msgsEl.scrollHeight;
    appEl.classList.add('thread-open');
    inputEl.focus({ preventScroll: true });
  }

  function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    const c = channel(activeId);
    bubble('me', text, fmtTime(new Date()));
    msgsEl.scrollTop = msgsEl.scrollHeight;
    inputEl.value = '';

    const relay = document.createElement('div');
    relay.className = 'relay';
    relay.innerHTML = relayIcon + '<span>' + c.queue.split(' ')[0] + '</span>';
    msgsEl.appendChild(relay);
    msgsEl.scrollTop = msgsEl.scrollHeight;

    setTimeout(() => {
      relay.classList.add('out');
      const typingRow = document.createElement('div');
      typingRow.className = 'bubble-row them';
      typingRow.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      msgsEl.appendChild(typingRow);
      msgsEl.scrollTop = msgsEl.scrollHeight;

      setTimeout(() => {
        relay.remove();
        typingRow.remove();
        const replyText = c.reply(text, c.state);
        bubble('them', replyText, fmtTime(new Date()));
        msgsEl.scrollTop = msgsEl.scrollHeight;
      }, 850);
    }, 500);
  }

  document.getElementById('sendBtn').addEventListener('click', send);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  document.getElementById('backBtn').addEventListener('click', () => appEl.classList.remove('thread-open'));

  renderSidebar();
  openChannel(activeId);
})();
</script>
</body>
</html>
